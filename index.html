<body><main><h1>Nekonote Analytics</h1><p>YouTubeチャンネル「猫の手も貸したい」の運営者が、サムネイルの表示回数とクリック率（CTR）を確認するために使う個人用Windowsアプリです。</p><p>運営者本人がGoogle OAuthで許可します。アプリはYouTube Data APIで対象チャンネルを照合し、YouTube Reporting APIで日次レポートを取得して、運営者のPCに保存します。</p><nav><a href="./">ホーム</a> · <a href="privacy.html">プライバシーポリシー</a> · <a href="terms.html">利用規約</a> · <a href="https://github.com/AMBERandCYAN">お問い合わせ</a></nav></main></body>
